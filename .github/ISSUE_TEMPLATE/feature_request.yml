name: 功能建议
description: 提出一个功能或改进想法
title: "[feat] 简短的标题"
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述使用场景与痛点，不要先写实现方案。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 期望的行为
      description: 你期望系统怎么表现？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他做法？为什么当前方案更合适？
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我了解本项目当前不实现支付/微信登录/核销/上线，该建议不依赖这些能力
        - label: 我了解贡献前需先讨论设计（见 CONTRIBUTING.md）
